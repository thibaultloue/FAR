<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="t d"><title id="t">Déroulé proposé de la journée</title><desc id="d">9 h installation, 12 h ouverture, 14 h point conseiller, 15 h 30 derniers arbitrages, 16 h fermeture des commandes.</desc><path d="M72 62V607" stroke="#CBC5B8" stroke-width="2"/><path d="M72 203V593" stroke="#E56336" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#171715"><circle cx="72" cy="78" r="7" fill="#171715"/><text x="109" y="88" font-size="34" font-weight="700">9 h</text><text x="109" y="123" font-size="22">Installation &amp; mise en place</text><circle cx="72" cy="202" r="7" fill="#E56336"/><text x="109" y="212" font-size="34" font-weight="700">12 h</text><text x="109" y="247" font-size="22">Ouverture des 3 caisses</text><circle cx="72" cy="326" r="7" fill="#E56336"/><text x="109" y="336" font-size="34" font-weight="700">14 h</text><text x="109" y="371" font-size="22">5 min de conseil par candidat</text><circle cx="72" cy="450" r="7" fill="#E56336"/><text x="109" y="460" font-size="34" font-weight="700">15 h 30</text><text x="109" y="495" font-size="22">Derniers arbitrages de production</text><circle cx="72" cy="574" r="7" fill="#171715"/><text x="109" y="584" font-size="34" font-weight="700">16 h</text><text x="109" y="619" font-size="22">Fermeture des commandes</text><text x="44" y="673" font-size="14" fill="#72726B">HORAIRES DE TRAVAIL PROPOSÉS · À VALIDER AU REPÉRAGE</text></g></svg>