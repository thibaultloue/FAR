<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="t d"><title id="t">Point conseiller à mi-service</title><desc id="d">Lire les ventes et le stock, échanger 5 minutes, puis choisir un ajustement de prix, de production ou de mise en avant.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#6D726D" fill="none"/></marker></defs><g font-family="Arial,sans-serif" fill="#171715"><path d="M38 76H273V248H38Z" fill="#EEE8DD"/><path d="M56 96H253M56 117H228M56 138H242" stroke="#A39D8F" stroke-width="2"/><text x="56" y="178" font-size="22" font-weight="700">Ventes + stock</text><text x="56" y="211" font-size="17">Le point à 14 h</text><path d="M295 163H393" stroke="#6D726D" stroke-width="2" marker-end="url(#a)"/><circle cx="506" cy="164" r="82" fill="#0C5989"/><text x="506" y="167" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">5 min</text><text x="506" y="194" text-anchor="middle" font-size="15" fill="#FFFFFF">par candidat</text><path d="M610 163H705" stroke="#6D726D" stroke-width="2" marker-end="url(#a)"/><path d="M733 96V246" stroke="#A39D8F"/><text x="754" y="109" font-size="27" font-weight="700">Prix</text><text x="754" y="172" font-size="27" font-weight="700">Production</text><text x="754" y="235" font-size="27" font-weight="700">Mise en avant</text><text x="38" y="304" font-size="14" fill="#72726B">MÊME TEMPS D’ACCÈS AU CONSEIL · LE CANDIDAT CHOISIT SON AJUSTEMENT</text></g></svg>